# OpenKM
openkm.url=$OPEN_KM_URL
base.openkm.url=$OPEN_KM_BASE_URL

# OpenKM admin user
admin.user=okmAdmin
admin.password=admin

# OpenKM 7 and KEA both run Spring Boot with HikariCP in the same Tomcat, and
# both would register an MBean named com.zaxxer.hikari:name=dataSource. The
# second one to deploy fails with InstanceAlreadyExistsException, so keep
# KEA out of JMX.
spring.jmx.enabled=false